<!DOCTYPE html>
<html lang="en">
<head>
    <title>Latihan DOM</title>
</head>

<style>
    html, body{
        height: 100%;
    }
    body{
        text-align: center;
    }

    .biru-muda{
        background-color: lightblue;
    }

    .kotak {
        width: 25px;
        height: 25px;
        margin: 10px auto;
    }

    .merah{
        background-color: red;
    }
    .hijau{
        background-color: green;
    }
    .biru{
        background-color: blue;
    }
</style>
<body>
    <h1>Bermain dengan Warna</h1>
    <div>
        <button id="btn">TEKAN SAYA!!!</button>
        <br><br>

        <div class="kotak merah"></div>
        <input type="range" name="red" min="1" max="255">

        <div class="kotak hijau"></div>
        <input type="range" name="green" min="1" max="255">

        <div class="kotak biru"></div>
        <input type="range" name="blue" min="1" max="255">


    </div>
    <script src="script.js"></script>
</body>
</html>
